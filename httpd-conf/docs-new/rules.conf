# ─────────────────────────────────────────────────────────────────────────────
#  Local development rules for docs v2 — devwebsite.testsigma.com/docs-new/
#
#  Mounted into the shared dev httpd container by
#  dev-setup/docker/httpd/docker-compose.yml, alongside every other app's rules.
#
#  PROXIES to the Astro dev server rather than serving a build, so edits are live
#  and no `npm run build` is needed in the loop. Start it first:
#
#      cd testsigma-docs-v2 && npm run dev      # listens on 4321
#
#  Without it /docs-new/ returns 503 — that is the dev server being down, not a
#  broken rule.
#
#  The dev server already serves under /docs-new/ (astro.config.mjs `base`), so
#  the prefix is passed through unchanged rather than stripped. Keep it that way:
#  rewriting the prefix here would make local behaviour differ from production,
#  where the built assets carry /docs-new/ in their URLs.
#
#  NOTE: no ProxyPreserveHost here. Every app's rules are Included into the MAIN
#  server config (no vhosts), so that directive is server-wide -- setting it
#  would silently change proxying for every other app in this container, and the
#  website's own docs rules explicitly set it Off.
# ─────────────────────────────────────────────────────────────────────────────

# Astro's dev client opens a websocket for hot reload. Without this it retries
# forever and the browser console fills with connection errors.
RewriteCond %{HTTP_HOST} "devwebsite.testsigma.com"
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/docs-new(/.*)?$ ws://host.docker.internal:4321/docs-new$1 [P,L]

RewriteCond %{HTTP_HOST} "devwebsite.testsigma.com"
RewriteRule ^/docs-new$ http://host.docker.internal:4321/docs-new/ [P,L]

RewriteCond %{HTTP_HOST} "devwebsite.testsigma.com"
RewriteRule ^/docs-new(/.*)$ http://host.docker.internal:4321/docs-new$1 [P,L]

# Path-scoped, so unlike ProxyPreserveHost this cannot affect other apps.
ProxyPassReverse /docs-new/ http://host.docker.internal:4321/docs-new/
