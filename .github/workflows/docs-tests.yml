name: Docs Site Tests

# Gates every PR into main: waits for the Vercel preview to deploy, then runs
# the full-site crawl + Playwright smoke tests against it. Fails the check
# (blocking merge, if added as a required status check in branch protection)
# if any page or feature has an error.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (defaults to production if run manually)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Waits for Vercel's GitHub integration to post a deployment for this
      # PR, then returns its preview URL. No Vercel token needed as long as
      # the Vercel GitHub App is connected to this repo.
      - name: Wait for Vercel preview deployment
        if: github.event_name == 'pull_request'
        id: vercel_preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Resolve BASE_URL
        id: resolve_url
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.vercel_preview.outputs.url }}" ]; then
            echo "url=${{ steps.vercel_preview.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://docs-v2-alpha.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run full-site crawl (all entities)
        env:
          BASE_URL: ${{ steps.resolve_url.outputs.url }}
        run: npm run test:crawl

      - name: Run feature smoke tests
        env:
          BASE_URL: ${{ steps.resolve_url.outputs.url }}
        run: npm run test:e2e

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: crawl-report.json
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}" === "success" ? "✅ 0 errors — safe to merge" : "❌ Failures found — check the Actions run for the crawl report and Playwright results before merging";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Docs site test suite ran against:** ${{ steps.resolve_url.outputs.url }}\n\n${status}`
            });
