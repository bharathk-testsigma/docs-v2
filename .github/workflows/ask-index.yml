name: 'Ask index - Rebuild'
run-name: 'Ask index - rebuild on ${{ github.ref_name }}'

# public/ask-index.bin + .meta.json are COMMITTED artefacts: api/ask.ts (on
# Vercel) reads them off the filesystem, and vercel.json bundles them into the
# function. They are generated by embedding every doc page through the LiteLLM
# gateway, so they go stale the moment content changes and nothing regenerates
# them.
#
# This workflow is the thing that regenerates them. It needs the gateway
# credentials -- ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL -- which used to live
# only in a developer's local .env and now come from repository secrets.
#
# The deploy workflow (manual.yml) deliberately does NOT rebuild the index: it
# only ever ships what is committed, so a deploy is reproducible from the tree.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the regenerated index back to this branch'
        type: boolean
        default: true
  push:
    branches: [dev]
    paths:
      - 'src/content/docs/**'
      - 'scripts/build-ask-index.mjs'

# Needs write access to push the regenerated index back.
permissions:
  contents: write

concurrency:
  # Two rebuilds on one branch race on the commit, and each burns gateway spend.
  group: ask-index-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail here with a clear message rather than 40 lines into the script.
      # Both are LiteLLM gateway credentials; direct Anthropic keys are disabled.
      - name: Check gateway credentials are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          set -eu
          : "${ANTHROPIC_API_KEY:?missing repository secret ANTHROPIC_API_KEY}"
          : "${ANTHROPIC_BASE_URL:?missing repository secret ANTHROPIC_BASE_URL}"
          echo "gateway: ${ANTHROPIC_BASE_URL}"

      # `npm run build:ask-index` uses --env-file-if-exists, so it reads .env
      # locally and plain environment variables here. There is no .env in CI.
      - name: Rebuild Ask index
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: npm run build:ask-index

      - name: Commit regenerated index
        if: ${{ github.event_name == 'push' || inputs.commit }}
        run: |
          set -eu
          if git diff --quiet -- public/ask-index.bin public/ask-index.meta.json; then
            echo "Index unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ask-index.bin public/ask-index.meta.json
          git commit -m "chore(ask): rebuild retrieval index [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ask index rebuild"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Chunks | $(node -e 'console.log(require("./public/ask-index.meta.json").length)' 2>/dev/null || echo '?') |"
            echo "| Index size | $(du -h public/ask-index.bin 2>/dev/null | cut -f1) |"
            echo ""
            echo "The index is served by the Vercel function \`api/ask.ts\`, not by"
            echo "the httpd image — deploying docs does not publish a new index."
          } >> $GITHUB_STEP_SUMMARY
