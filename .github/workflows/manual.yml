name: 'Docs - Manual'
run-name: 'Docs - ${{ inputs.Environment }} (${{ github.ref_name }})'

# Same shape as the website repo's website-cd-eks-nextjs-manual.yml, because the
# deployment target is the same: an httpd image in ECR, rolled out to EKS by
# ArgoCD watching the devops-helm repo. The website's Apache proxies /docs-new
# to this service.
#
# Flow:  build static site -> bake into httpd image -> push to ECR
#        -> bump the image tag in devops-helm -> ArgoCD syncs -> invalidate CDN

on:
  workflow_dispatch:
    inputs:
      Environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production

# OIDC federation into AWS needs id-token. Contents stays read-only: the push to
# devops-helm authenticates as a GitHub App, not with this token.
permissions:
  id-token: write
  contents: read

concurrency:
  # Two concurrent deploys to one environment race on the devops-helm commit.
  group: docs-${{ inputs.Environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          set -eu
          echo "Branch      : ${GITHUB_REF##*/}"
          echo "Environment : ${{ inputs.Environment }}"

          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
          echo "AWS_DEFAULT_OUTPUT=json" >> $GITHUB_ENV
          echo "ECR_URL=479726090251.dkr.ecr.us-east-1.amazonaws.com" >> $GITHUB_ENV

          # NOTE: `inputs.Environment` — capital E. The website repo's workflow
          # reads `github.event.inputs.environment` in places, which is always
          # empty and silently produces a repo name ending in "-". Not copied.
          # Must match the ECR repository names that exist in AWS
          # (docs-v2-staging / docs-v2-production) AND the image in
          # devops-helm website/*-values.yaml under .Deployments.docsNew.
          echo "REPO_NAME=docs-v2-${{ inputs.Environment }}" >> $GITHUB_ENV

          if [[ "${{ inputs.Environment }}" == "production" ]]; then
            echo "AWS_ROLE_ARN=${{ secrets.WEBSITE_AWS_GITHUB_OIDC_ROLE_ARN }}" >> $GITHUB_ENV
            echo "HELM_BRANCH=prod" >> $GITHUB_ENV
            echo "VALUES_FILE=production-values.yaml" >> $GITHUB_ENV
            echo "CLOUD_FRONT_DISTRIBUTION_ID=${{ secrets.PROD_CLOUD_FRONT_DISTRIBUTION_ID_ELB }}" >> $GITHUB_ENV
            echo "SITE_URL=https://testsigma.com/docs-new/" >> $GITHUB_ENV
          elif [[ "${{ inputs.Environment }}" == "staging" ]]; then
            echo "AWS_ROLE_ARN=${{ secrets.WEBSITE_AWS_GITHUB_OIDC_ROLE_ARN }}" >> $GITHUB_ENV
            echo "HELM_BRANCH=prod" >> $GITHUB_ENV
            echo "VALUES_FILE=staging-values.yaml" >> $GITHUB_ENV
            echo "CLOUD_FRONT_DISTRIBUTION_ID=${{ secrets.WEBSITE_CLOUD_FRONT_DISTRIBUTION_ID_ELB_V1 }}" >> $GITHUB_ENV
            echo "SITE_URL=https://website.testsigma.com/docs-new/" >> $GITHUB_ENV
          else
            echo "environment not supported"
            exit 1
          fi

      # Scoped to the one repo this workflow writes to. A PAT would grant far
      # more; the App token is short-lived and repo-scoped.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_CD_APP_ID }}
          private-key: ${{ secrets.CI_CD_APP_PRIVATE_KEY }}
          owner: TestsigmaInc
          repositories: devops-helm

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # astro@7 requires Node ^20.19 || >=22.12. The website repo pins 18, which
      # would fail this build.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` chains prebuild (clears public/pagefind), the Astro build
      # (dist/ + dist/pagefind for search) and postbuild. Only dist/ is shipped.
      - name: Build static site
        run: |
          set -eu
          npm run build
          # Stamp the build with the commit it came from. This is what makes the
          # "Verify the deploy is live" step below able to tell "the new docs are
          # serving" from "something else is answering on this URL" -- which is
          # exactly the failure that went undetected on 2026-08-20 (see that
          # step). A short SHA, served as a plain text file at
          # <SITE_URL>build-id.txt.
          git rev-parse --short HEAD > dist/build-id.txt

      # scripts/verify-dist.mjs, not inline greps. The checks used to live here,
      # and one of them named a content path:
      #
      #   grep -q '"/docs-new/' dist/index.html \
      #                         dist/suite/get-started/introduction/index.html
      #
      # The v7 IA rewrite renamed that page to get-started/overview, so the second
      # file stopped existing -- and the check went on PASSING, because GNU grep
      # -q exits 0 on the first match and never opens the rest. (BSD grep returns
      # 2, so this failed locally and passed in CI: worse than either.) A check
      # that silently stops checking is the failure mode to avoid here.
      #
      # The script names no content path. It follows the root redirect to find
      # home, and follows every other redirect stub in dist/ to confirm it still
      # points at a page that was built -- so an IA rename fails loudly, naming
      # the dangling redirect, instead of quietly verifying nothing.
      - name: Verify build output
        run: |
          set -eu
          npm run verify:dist
          du -sh dist

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push image to ECR
        run: |
          set -eux
          GIT_HASH=$(git rev-parse --short HEAD)

          docker build -t "$REPO_NAME" -f Dockerfile .
          docker tag "$REPO_NAME:latest" "$ECR_URL/$REPO_NAME:latest"
          docker tag "$REPO_NAME:latest" "$ECR_URL/$REPO_NAME:tag-$GIT_HASH"
          docker push "$ECR_URL/$REPO_NAME:latest"
          docker push "$ECR_URL/$REPO_NAME:tag-$GIT_HASH"

      # ArgoCD watches devops-helm; bumping the tag here is what triggers the
      # rollout. Nothing in this workflow talks to the cluster directly.
      - name: Bump image tag in devops-helm
        run: |
          set -eu
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod a+x /usr/local/bin/yq

          GIT_HASH=$(git rev-parse --short HEAD)
          git clone --depth 1 --branch "$HELM_BRANCH" \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/TestsigmaInc/devops-helm.git"
          cd devops-helm/website

          PREV=$(yq '.Deployments.docsNew.containers.version' "$VALUES_FILE")
          echo "previous: $PREV   current: tag-$GIT_HASH"

          # `yq` prints the string "null" for a missing key. Without this check
          # the next step would happily create the key and ArgoCD would render a
          # Deployment nobody configured.
          if [[ "$PREV" == "null" ]]; then
            echo "::error::.Deployments.docsNew not found in $VALUES_FILE on branch $HELM_BRANCH."
            echo "The devops-helm entry must exist before the first deploy — see deploy/README.md."
            exit 1
          fi

          if [[ "$PREV" == "tag-$GIT_HASH" ]]; then
            echo "Image tag unchanged — nothing to roll out."
            exit 0
          fi

          yq e -i '.Deployments.docsNew.containers.version = "tag-'"$GIT_HASH"'"' "$VALUES_FILE"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git commit -am "docs-v2: deploy tag-$GIT_HASH to ${{ inputs.Environment }}"
          git push origin "$HELM_BRANCH"

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUD_FRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUD_FRONT_DISTRIBUTION_ID" --paths '/docs-new/*'

      # ── THE POINT OF THIS STEP ───────────────────────────────────────────────
      # On 2026-08-20 this workflow went fully green -- built 143 pages, pushed
      # docs-v2-staging:tag-a137ce3, bumped devops-helm, invalidated CloudFront --
      # while https://website.testsigma.com/docs-new/ served the website's Next.js
      # marketing homepage from S3. Every docs URL returned the same 28,703-byte
      # page with zero docs content. Nothing in the pipeline noticed, because
      # every step it checked really had succeeded: the image was correct, and
      # nothing was routing to it.
      #
      # A deploy that cannot be observed at its own URL is not a deploy. This
      # fetches the stamp written above and fails if the site is not serving THIS
      # commit, so a routing or rollout gap shows up here instead of as someone
      # noticing the docs look old.
      - name: Verify the deploy is live
        run: |
          set -eu
          SHA=$(git rev-parse --short HEAD)
          STAMP="${SITE_URL}build-id.txt"
          echo "Waiting for $STAMP to report $SHA"

          # ArgoCD syncs and rolls out asynchronously -- this workflow does not
          # drive it -- so poll rather than check once. 40 x 15s = 10 minutes,
          # comfortably longer than a 1-2 minute rollout of a static-site pod.
          for i in $(seq 1 40); do
            LIVE=$(curl -fsS --max-time 10 "$STAMP" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$LIVE" = "$SHA" ]; then
              echo "✓ live after $((i * 15))s — ${SITE_URL} is serving $SHA"
              exit 0
            fi
            # Truncated, and deliberately so: a 200 here does NOT mean the file
            # exists. The S3 website origin answers 200 with its 28KB homepage
            # for any path it does not have, so `curl -f` never trips and $LIVE
            # can be a whole HTML document. Logging it raw would put 28KB x 40
            # attempts in the job log.
            if [ -n "$LIVE" ]; then
              echo "  attempt $i: got '$(printf '%.20s' "$LIVE")'... (want '$SHA')"
            else
              echo "  attempt $i: no response"
            fi
            sleep 15
          done

          # ── Diagnose, do not just fail ────────────────────────────────────────
          # Which of these three it is decides who fixes it, so name it here
          # rather than leaving the next person to re-derive it from curl output.
          echo "::error::${SITE_URL} is not serving $SHA after 10 minutes."
          HDRS=$(curl -sS -o /tmp/body -D- --max-time 10 "$SITE_URL" || true)
          SRV=$(printf '%s' "$HDRS" | tr -d '\r' | awk 'tolower($1)=="server:"{print $2}' | head -1)
          CODE=$(printf '%s' "$HDRS" | awk '/^HTTP/{c=$2} END{print c}')
          echo "  $SITE_URL -> HTTP $CODE, served by ${SRV:-unknown}"

          if grep -q 'data-next-head' /tmp/body 2>/dev/null; then
            echo "::error::That is the WEBSITE's Next.js page, not the docs. CloudFront is not routing /docs-new/* to the ALB origin — it is falling through to the S3 website origin. Needs a cache behaviour for /docs-new/* on the distribution behind $SITE_URL, ordered ahead of the default. Infra change; the image in ECR is fine."
          elif [ "$CODE" = "503" ]; then
            echo "::error::503 from the load balancer: the /docs-new target group has no healthy targets. Check the httpd-docs-new-${{ inputs.Environment }} pod (ImagePullBackOff if the ECR tag does not exist) and that ArgoCD synced the Deployment, Service and ingress rule."
          else
            echo "::error::Reached something, but not this build. Check whether ArgoCD synced the devops-helm commit, and whether CloudFront still holds a cached copy."
          fi
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docs V2 deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.Environment }} |"
            echo "| Branch | ${GITHUB_REF##*/} |"
            echo "| Image | \`${{ env.ECR_URL }}/${{ env.REPO_NAME }}:tag-$(git rev-parse --short HEAD)\` |"
            echo "| Helm | \`devops-helm@${{ env.HELM_BRANCH }}\` → \`${{ env.VALUES_FILE }}\` |"
            echo "| URL | ${{ env.SITE_URL }} |"
            echo ""
            echo "ArgoCD rolls this out; the workflow does not wait for it."
          } >> $GITHUB_STEP_SUMMARY
