StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Testsigma

Packages = Microsoft

# Only .md is linted. Vale's .mdx support needs the extra `mdx2vast` binary
# (not installed locally or in CI), and there are only a handful of .mdx files.
[*.md]
BasedOnStyles = Microsoft, Testsigma

# --- Curated ruleset (Mintlify-style lean profile) ---
# We keep high-signal rules on (spelling/Vocab, Terms, Acronyms, Headings for
# sentence case, plus our house Testsigma rules) and switch off the Microsoft
# rules that are noisy or wrong for developer-facing technical docs.

# "For a general audience, use 'address' rather than 'URL'." — our audience is
# technical; URL/API/CLI are the correct words.
Microsoft.GeneralURL = NO

# Forces "don't"/"can't". We don't mandate contractions either way.
Microsoft.Contractions = NO

# Passive voice — too many false positives in reference/step content.
Microsoft.Passive = NO

# First-person / "we" — reference prose legitimately uses these.
Microsoft.We = NO
Microsoft.FirstPerson = NO

# Adverb and foreign-phrase nags (e.g. flags "e.g.", "via") — low value here.
Microsoft.Adverbs = NO
Microsoft.Foreign = NO
