# ─────────────────────────────────────────────────────────────────────────────
#  httpd config for the docs v2 image.
#
#  This container serves ONLY /docs-new/. Requests to / are not this service's
#  job and return 404, which is why the Kubernetes probes in devops-helm target
#  /docs-new/ rather than /.
#
#  IMPORTANT — this service is NOT behind the website's Apache. The website
#  ingress (devops-helm website/templates/ingress.yml) routes `path: /docs-new`
#  straight to httpd-docs-new-<env>-service, so none of the website repo's
#  conf/apache2/common/common.conf or conf/apache2/docs/rules.conf applies here.
#  Everything those files would have supplied — the security headers, the
#  staging noindex, the X-Forwarded-Proto handling — has to be set below.
#
#  That is also why this repo needs no equivalent of the website workflow's
#  `sed -i 's/devwebsite.testsigma.com/.../' conf/apache2/*/rules.conf` step: no
#  conf baked into this image names a hostname. The one file that does —
#  httpd-conf/docs-new/rules.conf — is the local dev proxy rule, mounted into the
#  dev httpd container and never copied into this image. Where behaviour really
#  does differ per environment (the noindex header), it is expressed as a
#  host-conditional `expr=` below rather than rewritten at build time, so staging
#  and production run byte-identical config.
# ─────────────────────────────────────────────────────────────────────────────

ServerName docs-new
# Silences the "Could not reliably determine the server's fully qualified domain
# name" warning that otherwise prints on every container start.

# The stock image answers with `Server: Apache/2.4.68 (Unix)`, handing a scanner
# the exact patch level to look up. Prod emits just "Apache".
ServerTokens Prod
ServerSignature Off

# TRACE is on by default and echoes the request back, headers included. Nothing
# here needs it and every security scan flags it.
TraceEnable Off

<Directory "/usr/local/apache2/htdocs/docs-new">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Astro emits directory-style URLs (/suite/foo/index.html), so DirectoryIndex is
# what makes /docs-new/suite/foo/ resolve.
DirectoryIndex index.html

# Astro builds a 404 page; without this Apache serves its own default instead.
ErrorDocument 404 /docs-new/404.html

# TLS terminates at the ALB and the pod is plain HTTP on :80, so Apache believes
# every request is http://. Mirrors common.conf in the website repo — without it
# any self-referential redirect below is built with an http:// scheme.
SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on

RewriteEngine On

# /docs-new -> /docs-new/  (relative asset URLs break without the trailing slash)
# The scheme is taken from X-Forwarded-Proto rather than left to Apache: a bare
# `/docs-new/` target here expands to http://, which downgrades the visitor and
# costs an extra ALB round trip back to https.
RewriteCond %{HTTP:X-Forwarded-Proto} =https
RewriteRule ^/docs-new$ https://%{HTTP_HOST}/docs-new/ [R=301,L]
RewriteRule ^/docs-new$ /docs-new/ [R=301,L]

<IfModule mod_headers.c>
    # The website serves these on every other path via conf/apache2/common and
    # conf/apache2/docs in the website repo. The ingress bypasses that Apache for
    # /docs-new, so the same set is repeated here — otherwise the docs would be
    # the one part of testsigma.com with no CSP, HSTS or framing protection.
    # Kept in sync with conf/apache2/docs/rules.conf in TestsigmaInc/website.
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Content-Security-Policy "default-src 'self' https://*.testsigma.com; style-src 'self' https://*.testsigma.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://*.testsigma.com data: blob:; img-src * https: data: blob: about:; script-src * https: 'unsafe-inline' 'unsafe-eval'; worker-src https: blob: 'unsafe-eval' 'unsafe-inline'; frame-ancestors https://testsigma.com https://*.testsigma.com; upgrade-insecure-requests; frame-src * https:; connect-src 'self' https: http: wss:; object-src https: http:;"
    Header set Strict-Transport-Security "max-age=31536000"
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Xss-Protection "1; mode=block"

    # Staging is reachable at website.testsigma.com/docs-new/ and must not be
    # indexed — two copies of the docs competing in search is the failure the
    # website repo already guards against for tms-docs. Host-conditional rather
    # than sed-substituted at build time, so both environments ship the same
    # config file and the rule cannot be silently lost by a missed sed.
    Header always set X-Robots-Tag "noindex, nofollow" "expr=%{HTTP_HOST} != 'testsigma.com'"
    # Content-hashed filenames (_astro/*, pagefind fragments) can never change
    # under the same name, so they are safe to cache hard.
    <LocationMatch "^/docs-new/(_astro|pagefind)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # HTML is not hashed. Without must-revalidate a docs fix stays invisible for
    # the cache lifetime.
    <LocationMatch "^/docs-new/.*\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </LocationMatch>
    <LocationMatch "^/docs-new/[^.]*$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </LocationMatch>

    Header set X-Content-Type-Options "nosniff"
</IfModule>

# ── MIME types ───────────────────────────────────────────────────────────────
# Compression below is keyed on Content-Type, so anything httpd cannot type is
# silently served uncompressed. Everything the build emits with an extension the
# stock mime.types does not know has to be declared here first.

# Pagefind's index shards and its wasm. Without a type they are sent with no
# Content-Type at all — 2.4 dropped DefaultType — so they are declared opaque
# binary here.
#
# They are NOT compressed below, and must not be: every one of these files is
# ALREADY gzip on disk (they start 1f 8b 08; `gzip -t` passes on them), because
# Pagefind ships its index pre-compressed and inflates it in the client. Running
# them through DEFLATE only burns CPU on every search and makes the response
# marginally larger. Nor can they be served with `Content-Encoding: gzip` to let
# the browser inflate instead — Pagefind expects the compressed bytes and would
# be handed something it cannot parse.
AddType application/octet-stream .pf_fragment .pf_meta .pf_index .pf_filter .pagefind

# `src/pages/[...slug].md.ts` emits one raw-Markdown copy of every page for the
# header's "Copy page" control. The route sets this type itself, but that header
# only exists during SSR — in a static build Astro writes a plain .md file and
# httpd types it, so the declaration has to be repeated here.
AddType text/markdown;charset=utf-8 .md

# ── Compression ──────────────────────────────────────────────────────────────
<IfModule mod_deflate.c>
    # NOTE text/javascript, not just application/javascript: httpd 2.4 follows
    # the IANA registry and types .js as text/javascript, so a list carrying only
    # the application/ spelling compresses no JavaScript whatsoever.
    AddOutputFilterByType DEFLATE \
        text/html text/css text/plain text/markdown \
        text/javascript application/javascript \
        application/json image/svg+xml \
        text/xml application/xml application/xhtml+xml

    # No application/octet-stream here on purpose — see the Pagefind note above.
    # The only files carrying that type in this build arrive pre-gzipped, and an
    # unknown-binary catch-all is exactly how they got double-compressed before.
    # woff2 types as font/woff2 and is likewise (correctly) left alone.
</IfModule>
