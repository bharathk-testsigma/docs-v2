# ─────────────────────────────────────────────────────────────────────────────
#  httpd config for the docs v2 image.
#
#  This container serves ONLY /docs-new/ — the website's own Apache proxies that
#  prefix here. Requests to / are not this service's job and return 404, which is
#  why the Kubernetes probes in devops-helm target /docs-new/ rather than /.
# ─────────────────────────────────────────────────────────────────────────────

ServerName docs-new
# Silences the "Could not reliably determine the server's fully qualified domain
# name" warning that otherwise prints on every container start.

<Directory "/usr/local/apache2/htdocs/docs-new">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Astro emits directory-style URLs (/suite/foo/index.html), so DirectoryIndex is
# what makes /docs-new/suite/foo/ resolve.
DirectoryIndex index.html

# Astro builds a 404 page; without this Apache serves its own default instead.
ErrorDocument 404 /docs-new/404.html

RewriteEngine On

# /docs-new -> /docs-new/  (relative asset URLs break without the trailing slash)
RewriteRule ^/docs-new$ /docs-new/ [R=301,L]

<IfModule mod_headers.c>
    # Content-hashed filenames (_astro/*, pagefind fragments) can never change
    # under the same name, so they are safe to cache hard.
    <LocationMatch "^/docs-new/(_astro|pagefind)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # HTML is not hashed. Without must-revalidate a docs fix stays invisible for
    # the cache lifetime.
    <LocationMatch "^/docs-new/.*\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </LocationMatch>
    <LocationMatch "^/docs-new/[^.]*$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </LocationMatch>

    Header set X-Content-Type-Options "nosniff"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain \
        application/javascript application/json image/svg+xml
</IfModule>

# The Pagefind index ships as .pf_fragment / .pf_meta files. Apache has no MIME
# type for them and would send application/octet-stream; the Pagefind client
# still works, but the bytes are then never compressed, and the index is the
# largest thing search downloads.
AddType application/octet-stream .pf_fragment .pf_meta .pf_index
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/octet-stream
</IfModule>
